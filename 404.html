<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found (404) | Gemini Watermark Remover</title>
  <meta name="description" content="The page you are looking for does not exist. Return to the free Gemini and Veo watermark remover." />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#eef5ff" />
  <link rel="icon" type="image/png" href="/my-first-project/assets/favicon-96x96.png" sizes="96x96" />
  <link rel="shortcut icon" href="/my-first-project/assets/favicon.ico" />
  <style>
    :root {
      --brand-primary: #3479dc;
      --brand-primary-hover: #2366c5;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --bg-primary: #eef5ff;
      --card-border: #d8e7fa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 15%, #ffffff 0%, rgba(255, 255, 255, 0) 45%),
        radial-gradient(circle at 85% 80%, #e2efff 0%, rgba(226, 239, 255, 0) 50%),
        var(--bg-primary);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, sans-serif;
      line-height: 1.6;
    }

    .card {
      width: 100%;
      max-width: 640px;
      padding: 44px 36px 38px;
      text-align: center;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      box-shadow: 0 24px 60px rgba(52, 121, 220, 0.14);
      backdrop-filter: blur(14px);
    }

    .logo {
      width: 64px;
      height: 64px;
      object-fit: contain;
      margin-bottom: 10px;
    }

    .code {
      margin: 0;
      font-size: clamp(3.4rem, 12vw, 5.2rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      background: linear-gradient(110deg, #3984f4, #70b5ff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h1 {
      margin: 10px 0 8px;
      font-size: clamp(1.25rem, 4vw, 1.6rem);
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    p {
      margin: 0 auto 26px;
      max-width: 46ch;
      color: var(--text-muted);
      font-size: 1rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 22px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .btn-primary {
      background: linear-gradient(110deg, #3984f4, #70b5ff);
      color: #ffffff;
      box-shadow: 0 10px 24px rgba(52, 121, 220, 0.28);
    }

    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(52, 121, 220, 0.34); }

    .btn-ghost {
      background: #ffffff;
      color: var(--brand-primary);
      border: 1px solid var(--card-border);
    }

    .btn-ghost:hover { background: #f4f9ff; transform: translateY(-2px); }

    .links {
      margin-top: 26px;
      font-size: 0.86rem;
      color: var(--text-muted);
    }

    .links a { color: var(--brand-primary); text-decoration: none; }
    .links a:hover { text-decoration: underline; }

    .btn:focus-visible,
    .links a:focus-visible {
      outline: 3px solid #0f172a;
      outline-offset: 3px;
      border-radius: 999px;
    }

    @media (max-width: 480px) {
      .card { padding: 34px 22px 30px; border-radius: 22px; }
      .btn { width: 100%; }
    }
  </style>
</head>

<body>
  <main class="card">
    <img class="logo" src="/my-first-project/assets/logo.webp" alt="Gemini Watermark Remover logo" width="64" height="64" />
    <p class="code">404</p>
    <h1>This page could not be found</h1>
    <p>The link may be broken, or the page may have moved. Your images and videos are still safe &mdash; nothing was uploaded anywhere.</p>

    <div class="actions">
      <a class="btn btn-primary" href="/my-first-project/">Go to homepage</a>
      <a class="btn btn-ghost" href="/my-first-project/index.html#panel-video">Open video remover</a>
    </div>

    <nav class="links" aria-label="Helpful links">
      <a href="/my-first-project/index.html#how-it-works">How it works</a> &nbsp;&middot;&nbsp;
      <a href="/my-first-project/index.html#faq">FAQ</a> &nbsp;&middot;&nbsp;
      <a href="/my-first-project/contact.html">Contact</a>
    </nav>
  </main>
</body>

</html>
